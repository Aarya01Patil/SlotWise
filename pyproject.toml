[project]
name = "slotwise"
version = "0.1.0"
description = "A patient scheduling agent with evidence-driven, bounded policy improvement."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<3",
  "groq>=0.30,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "tzdata>=2025.1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
slotwise = "slotwise.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pip-audit>=2.9,<3", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slotwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".slotwise/pytest-cache"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
extend-exclude = [".slotwise"]
